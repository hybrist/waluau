name: Ante

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ante-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ante-unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Install Playwright browsers
        run: pnpm --filter ante exec playwright install --with-deps chromium

      - name: Run Vitest unit tests
        run: pnpm --filter ante test:unit

  ante-browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Build
        run: pnpm --filter ante build

      - name: Install Playwright browsers
        run: pnpm --filter ante exec playwright install --with-deps chromium

      - name: Run semantic gameplay tests
        run: pnpm --filter ante test:gameplay
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'

  ante-renderer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Build
        run: pnpm --filter ante build

      - name: Install Playwright browsers
        run: pnpm --filter ante exec playwright install --with-deps chromium

      - name: Run app renderer and shader HMR tests
        run: pnpm --filter ante test:renderer
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'

  ante-visual:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install native compiler build tools
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm --filter ante build-storybook
      - name: Run independent Storybook visual suite
        run: pnpm --filter ante test:visual
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
      - name: Upload expected, actual, diff and trace artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ante-visual-diffs
          path: |
            apps/ante/visual-report/
            apps/ante/visual-results/
          retention-days: 14
