name: Ante

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ante-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ante-unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Install Playwright browsers
        run: pnpm --filter ante exec playwright install --with-deps chromium

      - name: Run Vitest unit tests
        run: pnpm --filter ante test:unit

      # The command Vercel deploys with. `./check` type-checks the stories on
      # their own, which catches a story left behind by a change to a shared
      # type; this catches the rest — the story glob, the framework options,
      # the shader source list — which that pass never loads.
      - name: Build Storybook
        run: pnpm --filter ante build-storybook

  ante-browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Build
        run: pnpm --filter ante build

      - name: Install Playwright browsers
        run: pnpm --filter ante exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm --filter ante test:e2e
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
