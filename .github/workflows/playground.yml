name: Playground

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!docs/**'

  playground:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Lint playground
        run: pnpm --filter playground lint

      - name: Test playground Vite plugin
        run: pnpm --filter playground test:plugin

      - name: Build playground
        run: pnpm --filter playground build

      - name: Install Playwright browsers
        run: pnpm --filter playground exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm --filter playground test
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
