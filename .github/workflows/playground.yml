name: Playground

on:
  pull_request:
    paths:
      - ".github/workflows/playground.yml"
      - "apps/playground/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust-toolchain.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/playground.yml"
      - "apps/playground/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust-toolchain.toml"

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playground:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build wasm bundle
        run: pnpm build:wasm

      - name: Lint playground
        run: pnpm --filter playground lint

      - name: Build playground
        run: pnpm --filter playground build
