name: Playground

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playground:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Lint playground
        run: pnpm --filter playground lint

      - name: Build playground
        run: pnpm --filter playground build

      - name: Install Playwright browsers
        run: pnpm --filter playground exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm --filter playground test
