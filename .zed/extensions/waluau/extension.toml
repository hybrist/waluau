id = "waluau"
name = "Waluau"
version = "0.1.0"
schema_version = 1
authors = ["Waluau contributors"]
description = "Waluau language support and integration with the Waluau language server."
repository = "https://github.com/hybrist/waluau"

[language_servers.waluau-lsp]
name = "Waluau Language Server"
languages = ["Waluau"]

[language_servers.waluau-lsp.language_ids]
Waluau = "waluau"

# The Waluau grammar lives in this repository (tools/tree-sitter-waluau)
# and is written against the compiler's own lexer and parser. Zed fetches
# the repository at `commit` and compiles the grammar from `path`, so bump
# `commit` after landing a grammar change.
[grammars.waluau]
repository = "https://github.com/hybrist/waluau"
commit = "8071ffcd62c4749fafc2fb5cf2f32c3e93d14125"
path = "tools/tree-sitter-waluau"
