<!doctype html>
<meta charset="utf-8">
<title>Chrome DWARF extension parser harness</title>
<pre id="output">Loading the official extension worker...</pre>
<script type="module">
  import { WorkerPlugin } from '/extension/DevToolsPluginHost.bundle.js';

  const parameters = new URLSearchParams(location.search);
  const moduleName = parameters.get('module') ?? 'dwarf_chrome_probe.wasm';
  const expectedSourceNames = parameters.getAll('source');
  if (expectedSourceNames.length === 0) expectedSourceNames.push('dwarf_chrome_probe.walu');
  const moduleUrl = new URL(`/fixture/${moduleName}`, location.href).href;
  const symbolsName = parameters.get('symbols');
  const symbolsUrl = symbolsName
    ? new URL(`/fixture/${symbolsName}`, location.href).href
    : '';
  const code = symbolsUrl
    ? undefined
    : await fetch(moduleUrl).then(response => response.arrayBuffer());
  const plugin = await WorkerPlugin.create();
  const rawModuleId = 'waluau-dwarf-chrome-probe';
  const rawModule = code ? { url: moduleUrl, code } : { url: moduleUrl };
  const sources = await plugin.addRawModule(rawModuleId, symbolsUrl, rawModule);
  const sourceResults = {};
  for (const sourceName of expectedSourceNames) {
    const sourceFileURL = sources.find(url => url.endsWith(`/${sourceName}`));
    if (!sourceFileURL) throw new Error(`authored Waluau source ${sourceName} not found in ${sources}`);

    const mappedLines = await plugin.getMappedLines(rawModuleId, sourceFileURL);
    const rawRanges = {};
    for (const lineNumber of mappedLines) {
      const ranges = [];
      for (let columnNumber = 0; columnNumber <= 80; columnNumber += 1) {
        const atColumn = await plugin.sourceLocationToRawLocation({
          rawModuleId,
          sourceFileURL,
          lineNumber,
          columnNumber,
        });
        for (const range of atColumn) {
          if (!ranges.some(item => item.startOffset === range.startOffset && item.endOffset === range.endOffset)) {
            ranges.push({ columnNumber, ...range });
          }
        }
      }
      rawRanges[lineNumber + 1] = ranges;
    }
    sourceResults[sourceName] = {
      sourceFileURL,
      mappedLinesOneBased: mappedLines.map(line => line + 1),
      rawRanges,
    };
  }

  const firstRange = Object.values(sourceResults)[0]
    ? Object.values(Object.values(sourceResults)[0].rawRanges).flat()[0]
    : undefined;
  const firstRawMapping = firstRange
    ? await plugin.rawLocationToSourceLocation({
        rawModuleId,
        codeOffset: firstRange.startOffset,
        inlineFrameIndex: 0,
      })
    : [];
  const firstFunction = firstRange
    ? await plugin.getFunctionInfo({
        rawModuleId,
        codeOffset: firstRange.startOffset,
        inlineFrameIndex: 0,
      })
    : null;
  const syntheticOffset = Number(parameters.get('syntheticOffset') ?? 162);
  const syntheticRawLocation = { rawModuleId, codeOffset: syntheticOffset, inlineFrameIndex: 0 };
  const syntheticSourceMapping = await plugin.rawLocationToSourceLocation(syntheticRawLocation);
  const syntheticFunction = await plugin.getFunctionInfo(syntheticRawLocation);

  const result = {
    extensionWorkerLoaded: true,
    sources,
    sourceResults,
    firstRawMapping,
    firstFunction,
    syntheticOffset,
    syntheticSourceMapping,
    syntheticFunction,
  };
  window.extensionProbeResult = result;
  document.querySelector('#output').textContent = JSON.stringify(result, null, 2);
</script>
